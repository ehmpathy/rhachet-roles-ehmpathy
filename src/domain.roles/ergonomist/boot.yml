# .what = cap on this role's boot, in o200k_base tokens
# .why  = a lean boot leaves context for the work; growth past the cap fails loud
#         (`repo introspect` halts the build; boot.budget.integration.test.ts fails)
# .note = measure via `npx rhachet roles cost --all`; to add a say brief, condense or demote
#         another first — raise this cap only as a deliberate, reviewed call
budget:
  tokens: 7_000
always:
  briefs:
    say:
      # the scorable definitions
      - briefs/fundamentals/def.ergonomic.md
      - briefs/fundamentals/def.frictionless.md

      # the rules that back the definitions
      - briefs/fundamentals/rule.require.discoverability.md
      - briefs/fundamentals/rule.require.status-feedback.md
      - briefs/fundamentals/rule.require.errors-name-the-fix.md
      - briefs/fundamentals/rule.require.safe-by-default.md
      - briefs/fundamentals/rule.require.help-on-demand.md
      - briefs/fundamentals/rule.forbid.ambiguous-labels.md
      - briefs/fundamentals/rule.prefer.defaults-match-common-case.md
      - briefs/fundamentals/rule.prefer.prevent-over-correct.md

      # treestruct shape — a header owns its trunk; a label owns its items
      - briefs/cli/rule.forbid.treestruct-header-gap.md
      - briefs/cli/rule.forbid.treestruct-indented-text-as-children.md

    ref:
      # ergonomics fundamentals — the cited canon each rule above traces to (loaded on demand)
      - briefs/fundamentals/ref.ergonomics.fundamentals.md

      # role rationale + adjacent rules (loaded on demand)
      - briefs/define.why-ergonomist-not-designer.md
      - briefs/rule.forbid.surprises.md
      - briefs/rule.prefer.symmetric-term-pairs.md
      - briefs/cli/rule.require.treestruct-output.md
