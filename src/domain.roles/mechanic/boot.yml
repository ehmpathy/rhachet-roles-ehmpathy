      - briefs/practices/lang.prose/rule.avoid.passive-voice.md
      - briefs/practices/lang.prose/rule.avoid.articles-copulas.md
      - briefs/practices/lang.prose/rule.prefer.one-instruction-per-sentence.md
      - briefs/practices/lang.prose/rule.prefer.active-simple-tense.md
      - briefs/practices/lang.prose/rule.prefer.wickup-touched-prose.md

    ref:
      # filename enforcement via hooks — ref only (hooks already block violations)
      - briefs/practices/lang.tones/rule.forbid.shouted-readme.md

      # term enforcement via hooks — ref only (hooks already block violations)
      - briefs/practices/lang.terms/rule.forbid.term-dryrun.md
      - briefs/practices/lang.terms/rule.forbid.term=dryrun.md
      - briefs/practices/lang.terms/rule.forbid.term=existing.md
      - briefs/practices/lang.terms/rule.forbid.term=helpers.md
      - briefs/practices/lang.terms/rule.forbid.term=normalize.md
      - briefs/practices/lang.terms/rule.forbid.term=resolve.md
      - briefs/practices/lang.terms/rule.forbid.term-script.md

      # supplements and references
      - briefs/practices/lang.terms/rule.prefer.term-supplier.md
      - briefs/practices/lang.terms/rule.prefer.kind-over-type.md
      - briefs/practices/lang.terms/rule.require.order.noun_adj.md.pt2.md
      - briefs/practices/lang.terms/define.exec-vs-apply.md
      - briefs/practices/lang.terms/define.prodcode-testcode.terms=prodcode_vs_testcode.md

  skills:
    say:
      # claude tools — the bulk edit tool; the hooks name the other safe tools when they block
      - skills/claude.tools/sedreplace.sh

      # package docs
      - skills/get.package.docs.sh

      # git commit
      - skills/git.commit/git.commit.push.sh
      - skills/git.commit/git.commit.set.sh

      # git branch
      - skills/git.branch.rebase/git.branch.rebase.sh

      # git release
      - skills/git.release/git.release.sh

      # git repo
      - skills/git.repo.get/git.repo.get.sh
      - skills/git.repo.test/git.repo.test.sh

      # git stage
      - skills/git.stage/git.stage.add.sh

      # github actions
      - skills/show.gh.test.errors.sh

      # github pr comments: read, upsert by key, delete
      - skills/git.pull.comment/git.pull.comment.get.sh
      - skills/git.pull.comment/git.pull.comment.set.sh
      - skills/git.pull.comment/git.pull.comment.del.sh

      # permissions: the pre-approved commands, on demand
      - skills/permissions.get.sh

    ref:
      # claude tools — each hook that blocks a raw command names its safe twin
      - skills/claude.tools/cpsafe.sh
      - skills/claude.tools/mvsafe.sh
      - skills/claude.tools/rmsafe.sh
      - skills/claude.tools/symlink.sh
      - skills/claude.tools/teesafe.sh

      # package management — rare, deliberate acts
      - skills/declapract.upgrade.sh
      - skills/set.package/set.package.install.sh
      - skills/set.package/set.package.upgrade.sh

      # git commit — human-run grants (bind, quota)
      - skills/git.commit/git.commit.bind.sh
      - skills/git.commit/git.commit.uses.sh

      # github actions — show.gh.test.errors covers the common case
      - skills/show.gh.action.logs.sh

      # cicd — a route, run on purpose
      - skills/cicd.deflake.sh

      # git pull comment — the spaced-verb dispatcher (git.pull.comment get|set|del)
      - skills/git.pull.comment/git.pull.comment.sh

      # permissions: what the nudge has recorded
      - skills/permissions.nudges.sh

