      # foundational terms
      - briefs/practices/lang.terms/define.directives.terms=forbid_avoid_prefer_require.md
      - briefs/practices/lang.terms/rule.forbid.gerunds.md
      - briefs/practices/lang.terms/rule.require.order.noun_adj.md
      - briefs/practices/lang.terms/rule.require.ubiqlang.md
