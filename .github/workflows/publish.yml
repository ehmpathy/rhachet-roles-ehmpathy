name: publish

on:
  push:
    tags:
      - v*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }} # per [workflow] x [branch, tag]
  cancel-in-progress: true #  cancel workflows for non-latest commits

permissions:
  id-token: write # required for oidc
  contents: read
  pull-requests: write # .test.yml integration shards: the github.comment real-api case edits a pr description
  issues: write # .test.yml integration shards: the github.comment real-api case posts and deletes a pr comment

jobs:
  test:
    uses: ./.github/workflows/.test.yml
    with:
      creds-aws-region: us-east-1
      creds-aws-role-arn: ${{ vars.CREDS_CICD_AWS_DEV_OIDC_ROLE_ARN }} # use aws auth via oidc, if this repo supplies it
    secrets: inherit # keyrack firewall in .test.yml filters to declared keys (keyrack.yml env test)

  publish:
    uses: ./.github/workflows/.publish-npm.yml
    needs: [test]
