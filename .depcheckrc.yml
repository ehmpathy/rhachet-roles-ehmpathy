# .why = `.claude` links to the actor's brain dir, which holds local plugin installs;
#        their files are not this package's source, so depcheck must not grade them
ignore-patterns:
  - .claude
  - .agent
ignores:
  - depcheck
  - declapract
  - declapract-typescript-ehmpathy
  - "@commitlint/config-conventional"
  - serverless-prune-plugin
  - husky
  - if-env
  - rhachet
  - "@tsconfig/node20"
  - "@tsconfig/strictest"
  - "@biomejs/biome"
  - esbuild-register
  - "@swc/core"
  - "@swc/jest"
  - tsc-alias
  - tsx
  - "@src/*"
  - "@src/.*"
  - yalc
  - rhachet-roles-bhrain
  - rhachet-roles-bhuild
  - rhachet-roles-ehmpathy
  - rhachet-brains-anthropic
  - rhachet-brains-openrouter
  - rhachet-roles-rhachet
